<!-- Wrapper changes from horizontal layout to vertical stack on smaller screens -->
<div class="flex flex-col min-[1201px]:flex-row h-screen bg-gray-100">

    <!-- Navigation Container (Topbar <= 1200px | Sidebar > 1200px) -->
    <aside [ngClass]="isExpanded ? 'min-[1201px]:w-64' : 'min-[1201px]:w-20'" class="bg-slate-900 text-white transition-all duration-300 ease-in-out relative shrink-0
           w-full h-auto flex flex-row items-center justify-between p-4 border-b border-slate-800
           min-[1201px]:h-full min-[1201px]:flex-col min-[1201px]:p-4 min-[1201px]:border-b-0">
        <!-- TOP / LEFT GROUP: Profile Section -->
        <div class="flex flex-row items-center min-[1201px]:flex-col min-[1201px]:items-stretch min-[1201px]:w-full">
            <!-- Profile Section -->
            <div class="flex items-center gap-3 overflow-hidden px-1 h-10 min-[1201px]:h-12 min-[1201px]:mb-8">
                <!-- Profile Icon -->
                <div
                    class="bg-indigo-600 p-2 rounded-xl shrink-0 flex items-center justify-center w-10 h-10 shadow-inner">
                    <mat-icon class="text-white">account_circle</mat-icon>
                </div>
                <!-- Profile Text Info -->
                <div [ngClass]="isExpanded ? 'min-[1201px]:opacity-100 min-[1201px]:w-auto' : 'min-[1201px]:opacity-0 min-[1201px]:w-0 min-[1201px]:pointer-events-none'"
                    class="flex flex-col min-w-0 transition-all duration-200">
                    <span class="font-semibold text-sm whitespace-nowrap text-slate-100 truncate">Shreyas Bhat</span>
                    <span
                        class="text-xs text-slate-400 whitespace-nowrap truncate min-[1201px]:block hidden">Admin</span>
                </div>
            </div>

            <!-- Center Links (Visible only on desktop sidebar mode) -->
            <nav class="hidden min-[1201px]:block space-y-2 mt-4">
                @for (item of menuItems; track item.label) {
                <button
                    class="w-full flex items-center gap-4 px-3 py-3 rounded-xl hover:bg-slate-800 text-slate-300 hover:text-white transition-colors group relative">
                    <div class="shrink-0 flex items-center justify-center"><mat-icon>{{ item.icon }}</mat-icon></div>
                    <span [ngClass]="isExpanded ? 'w-auto opacity-100' : 'w-0 opacity-0 pointer-events-none'"
                        class="whitespace-nowrap transition-all duration-300 overflow-hidden">{{ item.label }}</span>
                    @if (!isExpanded) {
                    <div
                        class="absolute left-full rounded-md px-2 py-1 ml-6 bg-slate-950 text-white text-sm invisible opacity-20 -translate-x-3 transition-all group-hover:visible group-hover:opacity-100 group-hover:translate-x-0 whitespace-nowrap z-50">
                        {{ item.label }}</div>
                    }
                </button>
                }
            </nav>
        </div>

        <!-- MIDDLE GROUP: Topbar Middle Navigation (Only visible <= 1200px) -->
        <nav
            class="flex flex-row items-center gap-2 min-[1201px]:hidden overflow-x-auto max-w-[50%] px-2 scrollbar-none">
            @for (item of menuItems; track item.label) {
            <button
                class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-slate-800 text-slate-300 hover:text-white transition-colors whitespace-nowrap text-sm">
                <mat-icon class="text-[20px] w-5 h-5 flex items-center justify-center">{{ item.icon }}</mat-icon>
                <span class="hidden md:inline">{{ item.label }}</span>
            </button>
            }
        </nav>

        <!-- BOTTOM / RIGHT GROUP: Divider & Logout -->
        <div class="flex flex-row items-center min-[1201px]:flex-col min-[1201px]:w-full">
            <!-- Divider line -->
            <hr class="hidden min-[1201px]:block border-slate-800 w-full my-4" />

            <!-- Logout Button -->
            <button (click)="logout()" class="flex items-center gap-2 px-3 py-2 rounded-lg text-rose-400 hover:text-rose-300 hover:bg-red-950/40 transition-colors group relative
               min-[1201px]:w-full min-[1201px]:gap-4 min-[1201px]:px-3 min-[1201px]:py-3 min-[1201px]:rounded-xl">
                <div class="shrink-0 flex items-center justify-center"><mat-icon>logout</mat-icon></div>
                <span
                    [ngClass]="isExpanded ? 'min-[1201px]:w-auto min-[1201px]:opacity-100' : 'min-[1201px]:w-0 min-[1201px]:opacity-0 min-[1201px]:pointer-events-none'"
                    class="whitespace-nowrap transition-all duration-300 overflow-hidden font-medium hidden min-[1201px]:inline">
                    Logout
                </span>
                <!-- Sidebar Hover Tooltip -->
                @if (!isExpanded) {
                <div
                    class="absolute left-full rounded-md px-2 py-1 ml-6 bg-red-950 text-rose-300 text-sm invisible opacity-20 -translate-x-3 transition-all group-hover:visible group-hover:opacity-100 group-hover:translate-x-0 whitespace-nowrap z-50 border border-red-900/50 hidden min-[1201px]:block">
                    Logout</div>
                }
            </button>
        </div>

        <!-- Collapse Toggle Floating Arrow (Only visible on Sidebar mode > 1200px) -->
        <button (click)="toggleSidebar()"
            class="hidden min-[1201px]:flex absolute -right-3 top-16 bg-indigo-600 text-white p-1 rounded-full border-2 border-gray-100 shadow-md hover:bg-indigo-700 transition-colors items-center justify-center">
            @if (isExpanded) {
            <mat-icon class="text-[16px] w-4 h-4 flex items-center justify-center">keyboard_double_arrow_left</mat-icon>
            } @else {
            <mat-icon class="text-[16px] w-4 h-4 flex items-center justify-center">keyboard_double_arrow_right</mat-icon>
            }
        </button>
    </aside>

    <!-- Fixed: Added Tailwind sizing classes directly onto the app-main element component -->
    <app-main class="flex-1 w-full overflow-y-auto block" />
</div>
