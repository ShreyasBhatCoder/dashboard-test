<!-- Wrapper changes from horizontal layout to vertical stack on smaller screens -->
<div class="flex flex-col min-[1201px]:flex-row h-screen">

    <!-- Premium Navigation Container (Topbar <= 1200px | Premium Collapsible Vertical Navbar >= 1201px) -->
    <aside [ngClass]="isExpanded ? 'min-[1201px]:w-64' : 'min-[1201px]:w-24'" class="bg-slate-950 text-white transition-all duration-300 ease-in-out relative shrink-0 z-40
           w-full h-auto flex flex-row items-center justify-between p-4 border-b border-slate-900 shadow-xl shadow-slate-950/20
           min-[1201px]:h-full min-[1201px]:flex-col min-[1201px]:p-5 min-[1201px]:border-b-0 min-[1201px]:border-r">

        <!-- TOP GROUP (Sidebar Layout >= 1201px) / LEFT GROUP (Topbar Layout <= 1200px) -->
        <div class="flex flex-row items-center min-[1201px]:flex-col min-[1201px]:items-stretch shrink-0">
            <!-- Brand Section Header Layout Frame -->
            <div class="flex items-center overflow-hidden h-12 min-[1201px]:h-14 min-[1201px]:mb-5 min-[1201px]:justify-center"
                [ngClass]="[
                    isExpanded ? 'min-[1201px]:gap-3.5' : '',
                    !isDesktop ? 'gap-3' : ''
                    ]">
                <!-- Brand Icon Box -->
                <div
                    class="bg-linear-to-br from-indigo-500 to-indigo-700 p-2.5 rounded-xl shrink-0 flex items-center justify-center w-11 h-11 shadow-lg shadow-indigo-500/20 mx-auto min-[1201px]:mx-0">
                    <mat-icon class="text-white scale-110">hub</mat-icon>
                </div>

                <!-- Fixed: Changed from 'hidden sm:flex' to 'flex' so the name is permanently visible on all mobile viewports -->
                <div [ngClass]="isExpanded ? 'min-[1201px]:opacity-100 min-[1201px]:w-auto' : 'min-[1201px]:opacity-0 min-[1201px]:w-0 min-[1201px]:pointer-events-none'"
                    class="flex flex-col min-w-0 transition-all duration-200 origin-left">
                    <span class="font-bold text-base tracking-wide text-slate-100 truncate">Freelancer's Hub</span>
                    <span
                        class="text-[10px] text-indigo-400 font-bold tracking-wider uppercase min-[1201px]:block hidden">Workspace
                        v1.0</span>
                </div>
            </div>

            <!-- DESKTOP NAVBAR LINKS: High-End Vertical Buttons (ONLY Visible >= 1201px) -->
            <nav class="hidden min-[1201px]:block space-y-1.5 mt-2 w-full">
                @for (item of menuItems; track item.label) {
                <button
                    class="w-full flex items-center gap-4 px-4 py-3.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-900 transition-all duration-200 group relative text-base font-bold tracking-wide cursor-pointer">
                    <div [ngClass]="isExpanded ? 'justify-start' : 'justify-center w-full'"
                        class="shrink-0 flex items-center text-slate-400 group-hover:text-indigo-400 transition-colors">
                        <mat-icon class="text-[22px] w-5 h-5 flex items-center justify-center">{{ item.icon
                            }}</mat-icon>
                    </div>
                    <span [ngClass]="isExpanded ? 'w-auto opacity-100' : 'w-0 opacity-0 pointer-events-none'"
                        class="whitespace-nowrap transition-all duration-300 overflow-hidden">{{ item.label }}</span>

                    @if (!isExpanded) {
                    <div
                        class="absolute left-full rounded-md px-2.5 py-1.5 ml-6 bg-slate-900 text-white text-xs font-semibold border border-slate-800 shadow-xl invisible opacity-0 -translate-x-3 transition-all group-hover:visible group-hover:opacity-100 group-hover:translate-x-0 whitespace-nowrap z-50">
                        {{ item.label }}
                    </div>
                    }
                </button>
                }
            </nav>
        </div>

        <!-- MIDDLE GROUP: Dynamic, Thumb-Zone Mobile Navigation Dock (ONLY Active <= 1200px) -->
        <!-- Fixed: Completely removed from the topbar layout and anchored strictly to the screen's bottom layout edge -->
        <!-- Fixed: Utilizes the new custom 'translucent-scroll' utility rule class to keep scroll indicators thin and clear -->
        <nav class="fixed bottom-0 left-0 right-0 bg-slate-950 border-t border-slate-900 px-4 py-2 
                    flex flex-row items-center justify-around z-40 shadow-2xl min-[1201px]:hidden
                    gap-2 select-none translucent-scroll">

            @for (item of menuItems; track item.label) {
            <button class="flex flex-col items-center justify-center text-slate-400 hover:text-white 
                           transition-all duration-200 whitespace-nowrap text-[11px] font-bold tracking-wide 
                           py-1 px-3 shrink-0 cursor-pointer min-w-17">

                <span class="flex shrink-0 text-slate-400 mb-0.5">
                    <mat-icon class="text-[20px] w-5 h-5 flex items-center justify-center">{{ item.icon }}</mat-icon>
                </span>

                <span class="inline-block">{{ item.label }}</span>
            </button>
            }
        </nav>

        <!-- RIGHT GROUP (Topbar Layout) / BOTTOM GROUP (Sidebar Layout): Profile Module & Logout -->
        <div
            class="flex flex-row items-center min-[1201px]:flex-col min-[1201px]:w-full shrink-0 select-none ml-auto min-[1201px]:ml-0 gap-3 min-[1201px]:gap-0">

            <!-- Premium Add-on 1: Sidebar Theme Switcher Module Layer -->
            <div [ngClass]="isExpanded ? 'min-[1201px]:px-4 min-[1201px]:justify-between' : 'min-[1201px]:px-0 min-[1201px]:justify-center'"
                class="hidden min-[1201px]:flex w-full items-center py-3 mb-2 rounded-xl text-slate-400 select-none transition-all duration-300">
                <div class="flex items-center" [ngClass]="isExpanded ? 'gap-4' : 'justify-center w-full'">
                    <div class="flex items-center justify-center text-slate-400"
                        [ngClass]="isExpanded ? 'shrink-0' : 'w-full'">
                        <mat-icon class="text-[22px] w-5 h-5 flex items-center justify-center"
                        [ngClass]="themeService.isDarkMode() ? 'text-amber-400' : 'text-slate-400'">
                            {{ themeService.isDarkMode() ? 'dark_mode' : 'light_mode' }}
                        </mat-icon>
                    </div>
                    @if (isExpanded) {
                    <span class="whitespace-nowrap transition-all duration-300 overflow-hidden text-sm font-semibold tracking-wide">
                        Dark Theme
                    </span>
                    }
                </div>
                <!-- Connected (change) callback handler directly to your toggleTheme method -->
                @if (isExpanded) {
                <mat-slide-toggle [checked]="themeService.isDarkMode()" (change)="themeService.toggleTheme()"
                    class="cursor-pointer scale-90 transition-opacity duration-300 shrink-0">
                </mat-slide-toggle>
                }
            </div>

            <!-- Premium Add-on 2: Compact Mobile Topbar Dark Mode Icon Button -->
            <!-- Connected (click) handler callback directly to your toggleTheme method -->
            <button (click)="themeService.toggleTheme()" [matTooltip]="themeService.isDarkMode() ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
                matTooltipPosition="below"
                class="min-[1201px]:hidden flex items-center justify-center p-2 rounded-xl border border-slate-900 bg-slate-900/40 text-slate-400 hover:text-white transition-all cursor-pointer relative shrink-0">
                <mat-icon class="text-[20px] w-5 h-5 flex items-center justify-center"
                    [ngClass]="themeService.isDarkMode() ? 'text-amber-400' : 'text-slate-400'">
                    {{ themeService.isDarkMode() ? 'dark_mode' : 'light_mode' }}
                </mat-icon>
            </button>


            <!-- Profile Interactive Deck Frame -->
            <div matTooltip="Shreyas Bhat (Admin)" matTooltipPosition="above" [matTooltipDisabled]="isDesktop"
                [ngClass]="isExpanded 
                    ? 'min-[1201px]:p-2.5 min-[1201px]:bg-slate-900/40 min-[1201px]:border min-[1201px]:border-slate-900/80 min-[1201px]:rounded-2xl justify-between w-full' 
                    : 'p-0 bg-transparent border-0 min-[1201px]:justify-center min-[1201px]:w-full'"
                class="flex items-center transition-all duration-300 relative group flex-row gap-2 cursor-pointer">

                <!-- Avatar & Text Info Container -->
                <div class="flex items-center gap-2 overflow-hidden"
                    [ngClass]="!isExpanded ? 'min-[1201px]:justify-center' : ''">
                    <div [ngClass]="!isExpanded ? 'min-[1201px]:mx-auto w-11 h-11' : 'w-9 h-9 min-[1201px]:w-11 min-[1201px]:h-11'"
                        class="bg-slate-900 border border-slate-800 p-1.5 rounded-xl shrink-0 flex items-center justify-center shadow-inner">
                        <mat-icon class="text-slate-400 scale-105">account_circle</mat-icon>
                    </div>
                    <div class="flex flex-col min-w-0 text-left transition-all duration-200 origin-left"
                        [ngClass]="isExpanded ? 'min-[1201px]:opacity-100 min-[1201px]:w-auto' : 'min-[1201px]:opacity-0 min-[1201px]:w-0 min-[1201px]:pointer-events-none'">
                        <span class="font-bold text-xs whitespace-nowrap text-slate-200 truncate">Shreyas Bhat</span>
                        <span class="text-[10px] text-slate-500 font-bold tracking-wider uppercase mt-0.5">Admin</span>
                    </div>
                </div>

                <!-- Expanded Standard Logout Trigger Button -->
                <button (click)="logout(); $event.stopPropagation()" title="Logout"
                    class="flex shrink-0 items-center justify-center p-2 rounded-xl text-rose-400 hover:bg-red-950/40 hover:text-rose-300 transition-all active:scale-95 duration-150 min-[1201px]:ml-auto cursor-pointer"
                    [ngClass]="{'min-[1201px]:hidden': !isExpanded}">
                    <mat-icon class="text-[18px] w-4.5 h-4.5 flex items-center justify-center">logout</mat-icon>
                </button>
            </div>
        </div>




        <!-- Premium Vertical Center Collapse Toggle Floating Circular Button -->
        <button (click)="toggleSidebar()"
            class="hidden min-[1201px]:flex absolute -right-3.5 top-1/2 -translate-y-1/2 bg-indigo-600 text-white p-1 rounded-full border-2 border-slate-50 shadow-md hover:bg-indigo-700 active:scale-90 transition-all items-center justify-center z-50 w-7 h-7 aspect-square cursor-pointer">
            @if (isExpanded) {
            <mat-icon
                class="text-[14px] w-3.5 h-3.5 flex items-center justify-center font-bold">keyboard_double_arrow_left</mat-icon>
            } @else {
            <mat-icon
                class="text-[14px] w-3.5 h-3.5 flex items-center justify-center font-bold">keyboard_double_arrow_right</mat-icon>
            }
        </button>
    </aside>

    <!-- Main Content Canvas Layout Container -->
    <app-main class="flex-1 w-full overflow-y-auto block dark:text-slate-100" />
</div>
