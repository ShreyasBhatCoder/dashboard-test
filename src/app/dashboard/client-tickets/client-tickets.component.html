<mat-card class="max-w-4xl mx-auto my-7 shadow-md border border-slate-100 rounded-xl overflow-hidden">

    <!-- Header matching default mat-card styling -->
    <mat-card-header class="px-6 py-4 border-b border-slate-100">
        <mat-card-title class="text-lg font-semibold text-slate-800 tracking-tight">
            Client Tickets
        </mat-card-title>
    </mat-card-header>

    <mat-card-content class="p-0">
        <div class="overflow-x-auto">
            <table mat-table [dataSource]="dataSource" class="w-full text-sm text-left text-slate-600">

                <!-- Song Column -->
                <ng-container matColumnDef="song">
                    <th mat-header-cell *matHeaderCellDef
                        class="px-6 py-4 font-medium text-slate-500 border-b border-slate-100">
                        Song
                    </th>
                    <td mat-cell *matCellDef="let element"
                        class="px-6 py-4 font-medium text-slate-900 border-b border-slate-100">
                        {{element.song}}
                    </td>
                </ng-container>

                <!-- Artist Column -->
                <ng-container matColumnDef="artist">
                    <th mat-header-cell *matHeaderCellDef
                        class="px-6 py-4 font-medium text-slate-500 border-b border-slate-100">
                        Artist
                    </th>
                    <td mat-cell *matCellDef="let element" class="px-6 py-4 border-b border-slate-100">
                        {{element.artist}}
                    </td>
                </ng-container>

                <!-- Year Column -->
                <ng-container matColumnDef="year">
                    <th mat-header-cell *matHeaderCellDef
                        class="px-6 py-4 font-medium text-slate-500 border-b border-slate-100">
                        Year
                    </th>
                    <td mat-cell *matCellDef="let element" class="px-6 py-4 text-slate-500 border-b border-slate-100">
                        {{element.year}}
                    </td>
                </ng-container>

                <!-- Table Row Configurations -->
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"
                    class="hover:bg-slate-50/80 transition-colors duration-150 ease-in-out"></tr>

            </table>
        </div>
    </mat-card-content>
</mat-card>
